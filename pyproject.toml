[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsforecast"
version = "0.1.0"
description = "Reproducible time-series forecasting for TCS (NSE) closing prices"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
    "matplotlib==3.9.2",
    "pyyaml==6.0.2",
    "yfinance==0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "nbformat==5.10.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
