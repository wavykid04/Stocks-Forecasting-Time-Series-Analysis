name: Lint & Notebook Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install pandas numpy matplotlib statsmodels scipy scikit-learn seaborn nbformat nbconvert
      - name: Validate notebooks
        run: |
          python -c "import nbformat; nbformat.read(open('TCS_TSA.ipynb'), as_version=4)"
          python -c "import nbformat; nbformat.read(open('Arima.ipynb'), as_version=4)"
